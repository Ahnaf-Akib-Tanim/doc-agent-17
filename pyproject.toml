[project]
name = "doc-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # Upper bounds widened from the starter defaults to the versions the A2 build actually ran on
  # (see requirements.lock). Pinning to <4.45 transformers would not load Qwen3-VL at all.
  "torch>=2.2",
  "lightning>=2.2",
  "transformers>=4.40",
  "timm>=1.0",
  "datasets>=2.19",
  "torchmetrics>=1.3",
  "sentence-transformers>=2.7",
  "faiss-cpu>=1.8",
  "gymnasium>=0.29",
  "fastapi>=0.111",
  "gradio>=4.31",
  "wandb>=0.17",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "pydantic-settings>=2.2,<3.0",
  # Added in A2 — the knowledge-base stages import these directly and the pipeline cannot
  # build without them.
  "pymupdf>=1.24",              # Stage 1: PDF -> page rasters
  "opencv-python-headless>=4.9", # Stages 1-2: deskew, despeckle, Sauvola, layout morphology
  "scikit-image>=0.22",
  "rapidfuzz>=3.6",             # OCR CER/WER in notebooks/kb_demo.ipynb
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "black>=24.4", "mypy>=1.10", "pytest>=8.2", "pre-commit>=3.7"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Executed notebooks are evidence artefacts, not source; linting their cell source would mean
# reformatting recorded output.
exclude = ["notebooks"]
[tool.ruff.lint]
select = ["E","F","I","N","B","UP"]
# F405 comes from the starter template's own `from ..contracts import *  # noqa`, which every
# module in src/doc_agent ships with and which we are not allowed to restructure. Suppressed
# repo-wide rather than sprinkling per-line noqa through files we did not write.
ignore = ["F405"]
[tool.ruff.lint.per-file-ignores]
# Files we do not own: the fixed agent loop, the seam/guardrail stubs, the untouched optional/
# and training/ stubs, and the provided scripts. Their `a = 1; b = 2` style and long docstring
# lines are the template's, and rewriting them would put a large unrelated diff in this milestone.
"src/doc_agent/agent/agent.py" = ["E501", "E702"]
"src/doc_agent/agent/guardrails.py" = ["E702"]
"src/doc_agent/agent/tools.py" = ["E501"]
"src/doc_agent/contracts.py" = ["E501"]
"src/doc_agent/hooks.py" = ["E501"]
"src/doc_agent/logging_conf.py" = ["E702"]
"src/doc_agent/llm/postprocess.py" = ["E501"]
"src/doc_agent/optional/*" = ["E501"]
"src/doc_agent/training/*" = ["N812"]
"scripts/*" = ["E501", "E702"]
"grading_kit/success_check.py" = ["E501"]
[tool.black]
line-length = 100
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
